{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "back2trade.fullname" . }}-frontend
  labels:
    {{- include "back2trade.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    deployment.kubernetes.io/revision: {{ .Release.Revision | quote }}
    kubectl.kubernetes.io/restartedAt: {{ now | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "back2trade.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "back2trade.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        kubectl.kubernetes.io/restartedAt: {{ now | quote }}
        checksum/config: {{ .Values | toYaml | sha256sum }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "back2trade.serviceAccountName" . }}
      containers:
      - name: frontend
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.frontend.service.port }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.frontend.env.NODE_ENV | quote }}
        - name: PORT
          value: {{ .Values.frontend.env.PORT | quote }}
        - name: NEXT_PUBLIC_API_URL
          value: "http://{{ include "back2trade.fullname" . }}-backend:3001/api"
        {{- if and .Values.healthChecks .Values.healthChecks.frontend .Values.healthChecks.frontend.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.healthChecks.frontend.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if and .Values.healthChecks .Values.healthChecks.frontend .Values.healthChecks.frontend.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.healthChecks.frontend.readinessProbe | nindent 10 }}
        {{- end }}
        {{- with .Values.resources.frontend }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}