apiVersion: v1
kind: Secret
metadata:
  name: {{ include "back2trade.fullname" . }}-secrets
  labels:
    {{- include "back2trade.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.finnhub.token }}
  finnhub-token: {{ .Values.secrets.finnhub.token | b64enc }}
  {{- end }}
  {{- if .Values.secrets.finnhub.api }}
  finnhub-api: {{ .Values.secrets.finnhub.api | b64enc }}
  {{- end }}
  {{- if .Values.secrets.database.url }}
  database-url: {{ .Values.secrets.database.url | b64enc }}
  {{- end }}