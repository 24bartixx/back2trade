{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "back2trade.fullname" . }}-backend
  labels:
    {{- include "back2trade.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    deployment.kubernetes.io/revision: {{ .Release.Revision | quote }}
    kubectl.kubernetes.io/restartedAt: {{ now | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "back2trade.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "back2trade.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        kubectl.kubernetes.io/restartedAt: {{ now | quote }}
        checksum/config: {{ .Values | toYaml | sha256sum }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "back2trade.serviceAccountName" . }}
      containers:
      - name: backend
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.backend.service.port }}
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.backend.env.NODE_ENV | quote }}
        - name: PORT
          value: {{ .Values.backend.env.PORT | quote }}
        - name: DATABASE_URL
          value: "postgresql://{{ .Values.database.env.POSTGRES_USER }}:{{ .Values.database.env.POSTGRES_PASSWORD }}@{{ include "back2trade.fullname" . }}-database:{{ .Values.database.service.port }}/{{ .Values.database.env.POSTGRES_DB }}?schema=public"
        - name: PRISMA_SEED
          value: "false"
        {{- if .Values.secrets.finnhub.token }}
        - name: FINNHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "back2trade.fullname" . }}-secrets
              key: finnhub-token
        {{- end }}
        {{- if .Values.secrets.finnhub.api }}
        - name: FINNHUB_API
          valueFrom:
            secretKeyRef:
              name: {{ include "back2trade.fullname" . }}-secrets
              key: finnhub-api
        {{- end }}
        {{- if and .Values.healthChecks .Values.healthChecks.backend .Values.healthChecks.backend.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.healthChecks.backend.livenessProbe | nindent 10 }}
        {{- end }}
        {{- if and .Values.healthChecks .Values.healthChecks.backend .Values.healthChecks.backend.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.healthChecks.backend.readinessProbe | nindent 10 }}
        {{- end }}
        {{- with .Values.resources.backend }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}